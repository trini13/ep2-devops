# =============================================
# Pipeline CI/CD - Ingeniería DevOps EP2
# Asignatura: DOY0101
# =============================================

name: CI/CD Pipeline - Microservicio EP2

# Se ejecuta en cada push a main o pull request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # -----------------------------------------------
  # JOB 1: Construcción y Pruebas (IE1, IE2)
  # -----------------------------------------------
  build-and-test:
    name: Build y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4
      

      # 2. Configura Java 17
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Compila el proyecto
      - name: Compilar proyecto con Maven
        run: mvn clean compile -B

      # 4. Ejecuta las pruebas unitarias con JUnit (IE2)
      - name: Ejecutar pruebas unitarias
        run: mvn test -B

      # 5. Publica el reporte de resultados de pruebas
      - name: Publicar reporte de pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-pruebas
          path: target/surefire-reports/

      # 6. Construye el JAR
      - name: Empaquetar aplicación (JAR)
        run: mvn package -DskipTests -B

      # 7. Guarda el JAR como artefacto
      - name: Guardar JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # -----------------------------------------------
  # JOB 2: Análisis de Seguridad con Snyk (IE3)
  # -----------------------------------------------
  security-scan:
    name: Análisis de Seguridad
    runs-on: ubuntu-latest
    needs: build-and-test   # Solo si el build pasó

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Escaneo de vulnerabilidades con Snyk
      - name: Escaneo de seguridad con Snyk
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical


  # -----------------------------------------------
  # JOB 3: Construcción y publicación de imagen Docker (IE1)
  # -----------------------------------------------
  docker-build:
    name: Construir Imagen Docker
    runs-on: ubuntu-latest
    needs: security-scan    # Solo si el análisis de seguridad pasó

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Configura Docker Buildx (builder avanzado)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login a Docker Hub
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construye y publica la imagen Docker
      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/microservicio-ep2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/microservicio-ep2:${{ github.sha }}

# -----------------------------------------------
  # JOB 4: Despliegue en EC2 AWS Academy
  # -----------------------------------------------
  deploy:
    name: Despliegue en EC2
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Crear directorio del proyecto si no existe
            mkdir -p ~/ep3-devops

            # Copiar archivos necesarios
            cd ~/ep3-devops

            # Detener contenedores anteriores si existen
            docker-compose down || true

            # Descargar última imagen
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/microservicio-ep2:latest

            # Crear docker-compose.yml en EC2
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              microservicio:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/microservicio-ep2:latest
                container_name: microservicio-ep2
                ports:
                  - "8080:8080"
                restart: unless-stopped

              prometheus:
                image: prom/prometheus:latest
                container_name: prometheus
                ports:
                  - "9090:9090"
                volumes:
                  - ./prometheus.yml:/etc/prometheus/prometheus.yml
                restart: unless-stopped
                depends_on:
                  - microservicio

              grafana:
                image: grafana/grafana:latest
                container_name: grafana
                ports:
                  - "3000:3000"
                environment:
                  - GF_SECURITY_ADMIN_PASSWORD=admin123
                volumes:
                  - grafana-data:/var/lib/grafana
                restart: unless-stopped
                depends_on:
                  - prometheus

            volumes:
              grafana-data:
            EOF

            # Crear prometheus.yml en EC2
            cat > prometheus.yml << 'EOF'
            global:
              scrape_interval: 15s
            scrape_configs:
              - job_name: 'microservicio-ep2'
                metrics_path: '/actuator/prometheus'
                static_configs:
                  - targets: ['microservicio:8080']
            EOF

            # Levantar servicios
            docker-compose up -d

            echo "Despliegue completado exitosamente"
